<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crisis Pulse AI - منصة إدارة الأزمات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel (لترجمة كود JSX في المتصفح) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase Client -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      // إعدادات Supabase والبريد المخصص للأدمن
      const SUPABASE_URL = 'https://hupgacopzhqqsazsvefg.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1cGdhY29wemhxcXNhenN2ZWZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyOTcxNzQsImV4cCI6MjEwMjg3MzE3NH0.0ssHo3KGCSphiuFSiNUoG6aOCzAPP3Knzw6uK3qBRB8';
      const ADMIN_EMAIL = 'jemele2000@gmail.com';

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      function App() {
        const [user, setUser] = React.useState(null);
        const [email, setEmail] = React.useState('');
        const [password, setPassword] = React.useState('');
        const [activeTab, setActiveTab] = React.useState('dashboard');
        const [stats, setStats] = React.useState({ totalUsers: 142, totalReports: 38, activeAlerts: 5 });
        const [loading, setLoading] = React.useState(false);
        const [msg, setMsg] = React.useState('');

        React.useEffect(() => {
          supabase.auth.getSession().then(({ data: { session } }) => {
            setUser(session?.user ?? null);
          });

          const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
            setUser(session?.user ?? null);
          });

          return () => subscription.unsubscribe();
        }, []);

        React.useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, [user, activeTab]);

        const handleLogin = async (e) => {
          e.preventDefault();
          setLoading(true);
          setMsg('');
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) {
            setMsg('خطأ في تسجيل الدخول: ' + error.message);
          } else {
            setMsg('تم تسجيل الدخول بنجاح!');
          }
          setLoading(false);
        };

        const handleLogout = async () => {
          await supabase.auth.signOut();
          setUser(null);
          setActiveTab('dashboard');
        };

        const isAdmin = user && user.email === ADMIN_EMAIL;

        return (
          <div class="min-h-screen flex flex-col font-sans">
            <!-- الشريط العلوي Navigation -->
            <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
              <div class="max-w-6xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-3">
                  <i data-lucide="shield-alert" class="text-red-500 w-7 h-7"></i>
                  <h1 class="text-xl font-bold bg-gradient-to-r from-red-500 to-amber-500 bg-clip-text text-transparent">
                    Crisis Pulse AI
                  </h1>
                </div>

                <div class="flex items-center gap-4">
                  <button 
                    onClick={() => setActiveTab('dashboard')}
                    class={`px-3 py-1.5 rounded-lg text-sm font-medium transition ${activeTab === 'dashboard' ? 'bg-slate-800 text-white' : 'text-slate-400 hover:text-white'}`}>
                    الرئيسية
                  </button>

                  {isAdmin && (
                    <button 
                      onClick={() => setActiveTab('admin')}
                      class={`px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-1.5 transition ${activeTab === 'admin' ? 'bg-amber-600 text-white' : 'bg-amber-500/10 text-amber-400 hover:bg-amber-500/20'}`}>
                      <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                      لوحة الأدمن
                    </button>
                  )}

                  {user ? (
                    <div class="flex items-center gap-3">
                      <span class="text-xs text-slate-400 bg-slate-800 px-2 py-1 rounded-md">{user.email}</span>
                      <button onClick={handleLogout} class="text-xs bg-red-500/10 text-red-400 px-3 py-1.5 rounded-lg hover:bg-red-500/20">
                        خروج
                      </button>
                    </div>
                  ) : (
                    <span class="text-xs text-amber-500 bg-amber-500/10 px-2.5 py-1 rounded-full">زائر</span>
                  )}
                </div>
              </div>
            </header>

            <!-- المحتوى الرئيسي -->
            <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 space-y-6">
              
              {!user && (
                <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-6 max-w-md mx-auto shadow-2xl">
                  <h2 class="text-lg font-bold text-center mb-4 text-slate-200">تسجيل الدخول للنظام</h2>
                  <form onSubmit={handleLogin} class="space-y-4">
                    <div>
                      <label class="block text-xs text-slate-400 mb-1">البريد الإلكتروني</label>
                      <input 
                        type="email" 
                        required 
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        placeholder="jemele2000@gmail.com"
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-red-500 text-slate-100" 
                      />
                    </div>
                    <div>
                      <label class="block text-xs text-slate-400 mb-1">كلمة المرور</label>
                      <input 
                        type="password" 
                        required 
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-red-500 text-slate-100" 
                      />
                    </div>
                    <button 
                      type="submit" 
                      disabled={loading}
                      class="w-full bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white py-2.5 rounded-lg text-sm font-medium transition">
                      {loading ? 'جاري التحقق...' : 'دخول'}
                    </button>
                    {msg && <p class="text-xs text-center text-amber-400 mt-2">{msg}</p>}
                  </form>
                </div>
              )}

              {activeTab === 'dashboard' && (
                <div class="space-y-6">
                  <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col md:flex-row items-center justify-between gap-4">
                    <div>
                      <h2 class="text-2xl font-bold text-slate-100">متابعة الأزمات والتنبيهات المباشرة</h2>
                      <p class="text-sm text-slate-400 mt-1">منصة تحليل وتتبع الأزمات في الوقت الفعلي باستخدام الذكاء الاصطناعي.</p>
                    </div>
                    <div class="flex gap-3">
                      <div class="bg-slate-950 px-4 py-3 rounded-lg border border-slate-800 text-center">
                        <span class="block text-xl font-bold text-red-500">{stats.activeAlerts}</span>
                        <span class="text-xs text-slate-500">تنبيهات نشطة</span>
                      </div>
                      <div class="bg-slate-950 px-4 py-3 rounded-lg border border-slate-800 text-center">
                        <span class="block text-xl font-bold text-emerald-400">مستقر</span>
                        <span class="text-xs text-slate-500">حالة النظام</span>
                      </div>
                    </div>
                  </div>

                  <div class="grid md:grid-cols-2 gap-4">
                    <div class="bg-slate-900 p-5 rounded-xl border border-slate-800 space-y-3">
                      <div class="flex justify-between items-start">
                        <span class="bg-red-500/10 text-red-400 text-xs px-2.5 py-1 rounded-md border border-red-500/20">عالي الخطورة</span>
                        <span class="text-xs text-slate-500">قبل 15 دقيقة</span>
                      </div>
                      <h3 class="font-bold text-slate-200">تحليل انقطاع سلاسل الإمداد الطبية</h3>
                      <p class="text-xs text-slate-400 leading-relaxed">
                        تراقب الخوارزميات نقصاً محتملاً في الإمدادات الأسبوع المقبل، يُنصح بمراجعة مخزون الطوارئ.
                      </p>
                    </div>

                    <div class="bg-slate-900 p-5 rounded-xl border border-slate-800 space-y-3">
                      <div class="flex justify-between items-start">
                        <span class="bg-amber-500/10 text-amber-400 text-xs px-2.5 py-1 rounded-md border border-amber-500/20">متوسط الخطورة</span>
                        <span class="text-xs text-slate-500">قبل ساعة</span>
                      </div>
                      <h3 class="font-bold text-slate-200">تنبيه تقلبات الشبكة والاتصالات</h3>
                      <p class="text-xs text-slate-400 leading-relaxed">
                        تم رصد تذبذب في مؤشرات الاتصال في القطاع الشرقي، جاري مراقبة استقرار الخدمة.
                      </p>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'admin' && isAdmin && (
                <div class="space-y-6">
                  <div class="bg-amber-500/10 border border-amber-500/20 rounded-xl p-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                      <i data-lucide="shield-check" class="text-amber-500 w-6 h-6"></i>
                      <div>
                        <h3 class="font-bold text-amber-400">لوحة تحكم المسؤول (Admin Panel)</h3>
                        <p class="text-xs text-amber-300/70">أهلاً بك، هذه المنطقة مخصصة لإدارة النظام والتحكم الكامل.</p>
                      </div>
                    </div>
                    <span class="bg-amber-500 text-slate-950 font-bold text-xs px-2.5 py-1 rounded-md">Admins Only</span>
                  </div>

                  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                      <span class="text-xs text-slate-500 block mb-1">إجمالي المستخدمين</span>
                      <span class="text-3xl font-bold text-slate-100">{stats.totalUsers}</span>
                    </div>
                    <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                      <span class="text-xs text-slate-500 block mb-1">البلاغات المُعالجة</span>
                      <span class="text-3xl font-bold text-emerald-400">{stats.totalReports}</span>
                    </div>
                    <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                      <span class="text-xs text-slate-500 block mb-1">التنبيهات الفعالة</span>
                      <span class="text-3xl font-bold text-red-500">{stats.activeAlerts}</span>
                    </div>
                  </div>

                  <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4">
                    <h4 class="font-bold text-slate-200 flex items-center gap-2">
                      <i data-lucide="bell-plus" class="w-4 h-4 text-amber-500"></i>
                      إصدار تنبيه طوارئ جديد
                    </h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <input type="text" placeholder="عنوان التنبيه..." class="bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500" />
                      <select class="bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                        <option>عالي الخطورة (Red)</option>
                        <option>متوسط الخطورة (Yellow)</option>
                        <option>عادي (Info)</option>
                      </select>
                    </div>
                    <textarea rows="3" placeholder="تفاصيل التنبيه وتوصيات الذكاء الاصطناعي..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500"></textarea>
                    <button class="bg-amber-600 hover:bg-amber-500 text-white font-medium px-5 py-2 rounded-lg text-sm transition">
                      نشر التنبيه للنظام
                    </button>
                  </div>
                </div>
              )}

              {activeTab === 'admin' && !isAdmin && (
                <div class="bg-red-500/10 border border-red-500/20 text-red-400 rounded-xl p-8 text-center space-y-3">
                  <i data-lucide="lock" class="w-10 h-10 mx-auto text-red-500"></i>
                  <h3 class="font-bold text-lg">غير مصرح لك بالوصول</h3>
                  <p class="text-xs text-red-300/80">لوحة الأدمن مخصصة للمسؤولين فقط. يرجى تسجيل الدخول بحساب الأدمن المصرح.</p>
                </div>
              )}

            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
